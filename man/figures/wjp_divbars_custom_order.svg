<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Diverging bars with custom category order</title>
  <desc id="desc">Diverging horizontal bars show fictional trust shares, ordered from highest no-trust share to lowest. Orange extends left of zero and purple extends right.</desc>
  <rect width="1280" height="760" fill="#ffffff"/>
  <g font-family="Lato, Arial, sans-serif" fill="#1A1A1A">
    <text x="112" y="91" font-size="34" font-weight="700">Trust by country, ordered by no trust</text>
    <text x="112" y="130" font-size="18" fill="#555659">Illustrative data · Share of respondents · No Trust ← 0 → Trust</text>
    <rect x="430" y="158" width="18" height="18" rx="2" fill="#f26b21"/><text x="458" y="173" font-size="16">No Trust</text>
    <rect x="560" y="158" width="18" height="18" rx="2" fill="#482d8b"/><text x="588" y="173" font-size="16">Trust</text>
    <g stroke="#ECEDEF" stroke-width="1">
      <line x1="286" y1="204" x2="286" y2="602"/><line x1="432" y1="204" x2="432" y2="602"/>
      <line x1="578" y1="204" x2="578" y2="602" stroke="#262424" stroke-width="2"/>
      <line x1="724" y1="204" x2="724" y2="602"/><line x1="870" y1="204" x2="870" y2="602"/>
    </g>
    <g font-size="16" fill="#262424" text-anchor="middle">
      <text x="286" y="628">−100%</text><text x="432" y="628">−50%</text><text x="578" y="628">0%</text><text x="724" y="628">+50%</text><text x="870" y="628">+100%</text>
    </g>
    <g font-size="18" font-weight="700" fill="#262424" text-anchor="end">
      <text x="250" y="259">Wakanda</text><text x="250" y="339">Oz</text><text x="250" y="419">Neverland</text><text x="250" y="499">Narnia</text><text x="250" y="579">Atlantis</text>
    </g>
    <!-- This display order is supplied separately from the input row order. -->
    <g>
      <rect x="400.5" y="226" width="177.5" height="42" fill="#f26b21"/><rect x="578" y="226" width="113.5" height="42" fill="#482d8b"/>
      <rect x="423.8" y="306" width="154.2" height="42" fill="#f26b21"/><rect x="578" y="306" width="136.8" height="42" fill="#482d8b"/>
      <rect x="455.5" y="386" width="122.5" height="42" fill="#f26b21"/><rect x="578" y="386" width="169.5" height="42" fill="#482d8b"/>
      <rect x="473" y="466" width="105" height="42" fill="#f26b21"/><rect x="578" y="466" width="187" height="42" fill="#482d8b"/>
      <rect x="496.2" y="546" width="81.8" height="42" fill="#f26b21"/><rect x="578" y="546" width="210.2" height="42" fill="#482d8b"/>
    </g>
    <g font-size="16" font-weight="700" text-anchor="middle">
      <g fill="#262424"><text x="489.25" y="253">61%</text><text x="501" y="333">53%</text><text x="516.75" y="413">42%</text><text x="525.5" y="493">36%</text><text x="537" y="573">28%</text></g>
      <g fill="#ffffff"><text x="634.75" y="253">39%</text><text x="646.4" y="333">47%</text><text x="662.75" y="413">58%</text><text x="671.5" y="493">64%</text><text x="683" y="573">72%</text></g>
    </g>
    <line x1="286" y1="204" x2="870" y2="204" stroke="#D1CFD1"/>
    <text x="112" y="700" font-size="16" fill="#777777">Ordered by No Trust share, highest to lowest. Negative direction is a visual convention.</text>
  </g>
</svg>
