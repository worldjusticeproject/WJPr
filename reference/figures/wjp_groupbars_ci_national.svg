<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Grouped bars with confidence intervals and national benchmark</title>
  <desc id="desc">Fictional support rates by gender and age group, shown with 95 percent confidence intervals and a dashed vertical national average line at 72.3 percent.</desc>
  <rect width="1280" height="760" fill="#ffffff"/>
  <g font-family="Lato, Arial, sans-serif" fill="#262424">
    <text x="104" y="78" font-size="34" font-weight="700">Support by demographic group</text>
    <text x="104" y="116" font-size="18" fill="#555659">95% confidence intervals · National average: 72.3% · Illustrative data</text>
    <rect x="355" y="128" width="18" height="18" rx="2" fill="#482d8b"/><text x="383" y="143" font-size="16">Support</text>
    <line x1="516" y1="137" x2="544" y2="137" stroke="#f26b21" stroke-width="2.5" stroke-dasharray="6 5"/><text x="554" y="143" font-size="16" fill="#f26b21">National average</text>
    <line x1="704" y1="137" x2="734" y2="137" stroke="#4a4a49" stroke-width="3"/><line x1="704" y1="129" x2="704" y2="145" stroke="#4a4a49" stroke-width="3"/><line x1="734" y1="129" x2="734" y2="145" stroke="#4a4a49" stroke-width="3"/><text x="744" y="143" font-size="18" font-weight="700">95% CI</text>
    <g stroke="#e8e8e8" stroke-width="1">
      <line x1="355" y1="190" x2="355" y2="608"/><line x1="505" y1="190" x2="505" y2="608"/>
      <line x1="655" y1="190" x2="655" y2="608"/><line x1="805" y1="190" x2="805" y2="608"/>
      <line x1="955" y1="190" x2="955" y2="608" stroke="#c9c9c9"/>
    </g>
    <g font-size="17" font-weight="700" fill="#482d8b" text-anchor="middle">
      <text x="195" y="296">Gender</text><text x="195" y="508">Age group</text>
    </g>
    <text x="978" y="211" font-size="15" font-weight="700" fill="#555659">Share</text>
    <g font-size="18" text-anchor="end" fill="#4a4a49">
      <text x="330" y="263">Men</text><text x="330" y="328">Women</text>
      <text x="330" y="443">18–24</text><text x="330" y="508">25–54</text><text x="330" y="573">55+</text>
    </g>
    <g>
      <rect x="355" y="234" width="444" height="38" fill="#482d8b"/><rect x="799" y="234" width="156" height="38" fill="#f1f2f2"/>
      <rect x="355" y="299" width="420" height="38" fill="#482d8b"/><rect x="775" y="299" width="180" height="38" fill="#f1f2f2"/>
      <rect x="355" y="414" width="432" height="38" fill="#482d8b"/><rect x="787" y="414" width="168" height="38" fill="#f1f2f2"/>
      <rect x="355" y="479" width="438" height="38" fill="#482d8b"/><rect x="793" y="479" width="162" height="38" fill="#f1f2f2"/>
      <rect x="355" y="544" width="438" height="38" fill="#482d8b"/><rect x="793" y="544" width="162" height="38" fill="#f1f2f2"/>
    </g>
    <line x1="789" y1="187" x2="789" y2="608" stroke="#f26b21" stroke-width="2.5" stroke-dasharray="7 6"/>
    <rect x="704" y="188" width="170" height="23" rx="3" fill="#ffffff"/>
    <text x="789" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#d85d1d">National average: 72.3%</text>
    <g stroke="#4a4a49" stroke-width="3">
      <line x1="789.4" y1="253" x2="813.4" y2="253"/><line x1="789.4" y1="241" x2="789.4" y2="265"/><line x1="813.4" y1="241" x2="813.4" y2="265"/>
      <line x1="765.4" y1="318" x2="787.6" y2="318"/><line x1="765.4" y1="306" x2="765.4" y2="330"/><line x1="787.6" y1="306" x2="787.6" y2="330"/>
      <line x1="775.6" y1="433" x2="802" y2="433"/><line x1="775.6" y1="421" x2="775.6" y2="445"/><line x1="802" y1="421" x2="802" y2="445"/>
      <line x1="781" y1="498" x2="806.2" y2="498"/><line x1="781" y1="486" x2="781" y2="510"/><line x1="806.2" y1="486" x2="806.2" y2="510"/>
      <line x1="779.8" y1="563" x2="806.2" y2="563"/><line x1="779.8" y1="551" x2="779.8" y2="575"/><line x1="806.2" y1="551" x2="806.2" y2="575"/>
    </g>
    <g font-size="17" font-weight="700" fill="#482d8b">
      <text x="978" y="260">74%</text><text x="978" y="325">70%</text><text x="978" y="440">72%</text><text x="978" y="505">73%</text><text x="978" y="570">73%</text>
    </g>
    <g font-size="15" fill="#555659" text-anchor="middle">
      <text x="355" y="638">0%</text><text x="505" y="638">25%</text><text x="655" y="638">50%</text><text x="805" y="638">75%</text><text x="955" y="638">100%</text>
    </g>
    <line x1="104" y1="375" x2="955" y2="375" stroke="#e1e3e4" stroke-width="1.5"/>
    <text x="104" y="702" font-size="16" fill="#777777">Whiskers show the 95% confidence interval around each estimate.</text>
  </g>
</svg>
