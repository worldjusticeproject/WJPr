<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Report-style grouped bars with national and EU benchmarks</title>
  <desc id="desc">A compact WJP report-style chart with group names as header rows, national and EU average bars, a missing value shown as N slash A, and values aligned in a separate column.</desc>
  <rect width="1280" height="760" fill="#ffffff"/>
  <g font-family="Lato, Arial, sans-serif" fill="#262424">
    <text x="104" y="78" font-size="34" font-weight="700">Results by demographic group</text>
    <text x="104" y="116" font-size="18" fill="#555659">Subgroup results compared with national and EU averages · Illustrative data</text>
    <rect x="444" y="150" width="18" height="18" rx="2" fill="#482d8b"/><text x="472" y="165" font-size="16">Reported value</text>
    <rect x="584" y="150" width="18" height="18" rx="2" fill="#f1f2f2"/><text x="612" y="165" font-size="16">Remainder to 100%</text>
    <g stroke="#ececec" stroke-width="1">
      <line x1="444" y1="190" x2="444" y2="626"/><line x1="586.5" y1="190" x2="586.5" y2="626"/>
      <line x1="729" y1="190" x2="729" y2="626"/><line x1="871.5" y1="190" x2="871.5" y2="626"/>
      <line x1="1014" y1="190" x2="1014" y2="626" stroke="#c9c9c9"/>
    </g>
    <g font-size="17" font-weight="700" fill="#482d8b" text-anchor="middle">
      <text x="190" y="281">Benchmarks</text><text x="190" y="415">Gender</text><text x="190" y="569">Age group</text>
    </g>
    <text x="1030" y="219" font-size="15" font-weight="700" fill="#555659">Percent</text>
    <g font-size="17" fill="#4a4a49" text-anchor="end">
      <text x="414" y="259">National average</text><text x="414" y="303">EU average</text>
    </g>
    <g font-size="17" fill="#4a4a49" text-anchor="end">
      <text x="414" y="393">Male</text><text x="414" y="437">Female</text>
      <text x="414" y="525">55+</text><text x="414" y="569">35–54</text><text x="414" y="613">18–34</text>
    </g>
    <g>
      <rect x="444" y="235" width="387.6" height="30" fill="#482d8b"/><rect x="831.6" y="235" width="182.4" height="30" fill="#f1f2f2"/>
      <rect x="444" y="279" width="279.3" height="30" fill="#482d8b"/><rect x="723.3" y="279" width="290.7" height="30" fill="#f1f2f2"/>
      <rect x="444" y="369" width="370.5" height="30" fill="#482d8b"/><rect x="814.5" y="369" width="199.5" height="30" fill="#f1f2f2"/>
      <rect x="444" y="413" width="404.7" height="30" fill="#482d8b"/><rect x="848.7" y="413" width="165.3" height="30" fill="#f1f2f2"/>
      <rect x="444" y="501" width="347.7" height="30" fill="#482d8b"/><rect x="791.7" y="501" width="222.3" height="30" fill="#f1f2f2"/>
      <rect x="444" y="589" width="399" height="30" fill="#482d8b"/><rect x="843" y="589" width="171" height="30" fill="#f1f2f2"/>
    </g>
    <g font-size="16" font-weight="700" fill="#482d8b" text-anchor="start">
      <text x="1030" y="258">68%</text><text x="1030" y="302">49%</text><text x="1030" y="392">65%</text>
      <text x="1030" y="436">71%</text><text x="1030" y="524">61%</text><text x="1030" y="612">70%</text>
    </g>
    <text x="1030" y="568" font-size="16" font-weight="700" fill="#555659">N/A</text>
    <g font-size="14" fill="#555659" text-anchor="middle">
      <text x="444" y="651">0%</text><text x="586.5" y="651">25%</text><text x="729" y="651">50%</text><text x="871.5" y="651">75%</text><text x="1014" y="651">100%</text>
    </g>
    <g stroke="#e1e3e4" stroke-width="1.5">
      <line x1="104" y1="326" x2="1014" y2="326"/>
      <line x1="104" y1="460" x2="1014" y2="460"/>
    </g>
    <text x="104" y="706" font-size="16" fill="#777777">N/A means no value is available; gray bars show the remainder up to 100%.</text>
  </g>
</svg>
