<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Stacked bar chart: Trust and no trust</title>
  <desc id="desc">Horizontal 100 percent stacked bars showing fictional shares who trust or do not trust institutions in five fictional countries.</desc>
  <rect width="1280" height="760" fill="#ffffff"/>
  <g font-family="Lato, Arial, sans-serif" fill="#1A1A1A">
    <text x="112" y="91" font-size="34" font-weight="700">Trust and no trust in public institutions</text>
    <text x="112" y="130" font-size="18" fill="#555659">Stacked bars | Each bar totals 100% | Fictional example</text>
    <rect x="350" y="160" width="18" height="18" rx="2" fill="#f26b21"/><text x="378" y="175" font-size="16">No trust</text>
    <rect x="490" y="160" width="18" height="18" rx="2" fill="#482d8b"/><text x="518" y="175" font-size="16">Trust</text>
    <g stroke="#d1cfd1" stroke-width="1">
      <line x1="350" y1="202" x2="350" y2="602" stroke="#1A1A1A" stroke-width="1.5"/><line x1="490" y1="202" x2="490" y2="602" stroke="#ECEDEF"/>
      <line x1="630" y1="202" x2="630" y2="602" stroke="#ECEDEF"/><line x1="770" y1="202" x2="770" y2="602" stroke="#ECEDEF"/>
      <line x1="910" y1="202" x2="910" y2="602" stroke="#ECEDEF"/><line x1="1050" y1="202" x2="1050" y2="602" stroke="#D1CFD1" stroke-width="1.5"/>
    </g>
    <g font-size="18" font-weight="600" text-anchor="end">
      <text x="322" y="259">Atlantis</text><text x="322" y="339">Narnia</text><text x="322" y="419">Neverland</text>
      <text x="322" y="499">Oz</text><text x="322" y="579">Wakanda</text>
    </g>
    <!-- No trust segment first, followed by trust; each row sums to 100. -->
    <rect x="350" y="226" width="196" height="42" fill="#f26b21"/><rect x="546" y="226" width="504" height="42" fill="#482d8b"/>
    <rect x="350" y="306" width="252" height="42" fill="#f26b21"/><rect x="602" y="306" width="448" height="42" fill="#482d8b"/>
    <rect x="350" y="386" width="294" height="42" fill="#f26b21"/><rect x="644" y="386" width="406" height="42" fill="#482d8b"/>
    <rect x="350" y="466" width="371" height="42" fill="#f26b21"/><rect x="721" y="466" width="329" height="42" fill="#482d8b"/>
    <rect x="350" y="546" width="427" height="42" fill="#f26b21"/><rect x="777" y="546" width="273" height="42" fill="#482d8b"/>
    <g font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
      <text x="448" y="253">28%</text><text x="798" y="253">72%</text>
      <text x="476" y="333">36%</text><text x="826" y="333">64%</text>
      <text x="497" y="413">42%</text><text x="847" y="413">58%</text>
      <text x="535" y="493">53%</text><text x="885" y="493">47%</text>
      <text x="563" y="573">61%</text><text x="914" y="573">39%</text>
    </g>
    <g font-size="15" fill="#555659" text-anchor="middle">
      <text x="350" y="628">0%</text><text x="490" y="628">20%</text><text x="630" y="628">40%</text>
      <text x="770" y="628">60%</text><text x="910" y="628">80%</text><text x="1050" y="628">100%</text>
    </g>
    <text x="112" y="700" font-size="14" fill="#777777">Example chart created with WJPr::wjp_bars() | All country names and values are fictional</text>
  </g>
</svg>
