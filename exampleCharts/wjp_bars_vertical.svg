<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Vertical bar chart: Trust in public institutions</title>
  <desc id="desc">A WJP-style vertical bar chart with fictional trust percentages: Atlantis 72, Narnia 64, Neverland 58, Oz 47, and Wakanda 39 percent.</desc>
  <rect width="1280" height="760" fill="#ffffff"/>
  <g font-family="Lato, Arial, sans-serif" fill="#1A1A1A">
    <text x="112" y="91" font-size="34" font-weight="700">Trust in public institutions</text>
    <text x="112" y="130" font-size="18" fill="#555659">Vertical bars | Fictional example</text>
    <g stroke="#d1cfd1" stroke-width="1">
      <line x1="260" y1="200" x2="1100" y2="200" stroke="#D1CFD1" stroke-width="1.5"/><line x1="260" y1="260" x2="1100" y2="260" stroke="#ECEDEF"/>
      <line x1="260" y1="320" x2="1100" y2="320" stroke="#ECEDEF"/><line x1="260" y1="380" x2="1100" y2="380" stroke="#ECEDEF"/>
      <line x1="260" y1="440" x2="1100" y2="440" stroke="#ECEDEF"/><line x1="260" y1="500" x2="1100" y2="500" stroke="#1A1A1A" stroke-width="1.5"/>
    </g>
    <g font-size="15" fill="#555659" text-anchor="end">
      <text x="244" y="505">0%</text><text x="244" y="445">20%</text><text x="244" y="385">40%</text>
      <text x="244" y="325">60%</text><text x="244" y="265">80%</text><text x="244" y="205">100%</text>
    </g>
    <line x1="260" y1="500" x2="1100" y2="500" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="325" y="284" width="80" height="216" fill="#482d8b"/>
    <rect x="485" y="308" width="80" height="192" fill="#482d8b"/>
    <rect x="645" y="326" width="80" height="174" fill="#482d8b"/>
    <rect x="805" y="359" width="80" height="141" fill="#482d8b"/>
    <rect x="965" y="383" width="80" height="117" fill="#482d8b"/>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <text x="365" y="270">72%</text><text x="525" y="294">64%</text><text x="685" y="312">58%</text>
      <text x="845" y="345">47%</text><text x="1005" y="369">39%</text>
    </g>
    <g font-size="17" fill="#555659" text-anchor="middle">
      <text x="365" y="535">Atlantis</text><text x="525" y="535">Narnia</text><text x="685" y="535">Neverland</text>
      <text x="845" y="535">Oz</text><text x="1005" y="535">Wakanda</text>
    </g>
    <text x="680" y="590" font-size="16" fill="#555659" text-anchor="middle">Share of respondents who say they trust institutions</text>
    <text x="112" y="700" font-size="14" fill="#777777">Example chart created with WJPr::wjp_bars() | All country names and values are fictional</text>
  </g>
</svg>
